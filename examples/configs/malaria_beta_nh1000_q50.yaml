# Requested priors, 2026-11-15. Q is rounded continuous log-uniform, not log-weighted integers.
seed: 2026111501
num_generations: 120
num_simulations_per_batch: 128
num_batches: 7813
priors:
  num_hosts:
    dist: fixed
    kwargs:
      value: 1000
  num_transmitted_alleles:
    dist: rounded_loguniform
    kwargs:
      minval: 1
      maxval: 50
  chi:
    dist: beta
    kwargs:
      a: 1.0
      b: 2.0
  sw:
    dist: negative_beta
    kwargs:
      a: 1.0
      b: 4.0
  st:
    dist: beta
    kwargs:
      a: 1.0
      b: 3.0
  p_init:
    dist: beta
    kwargs:
      a: 1.0
      b: 3.0
output:
  store: outputs/transmission_120gen_1m_beta_nh1000_q50_v1/train.zarr
  overwrite: false
  num_batches_per_write: 8
  chunks:
    num_simulations: ${num_simulations_per_batch}
    num_generations: ${num_generations}
    num_states: 16
  compression:
    enabled: true
    codec: blosc
    cname: zstd
    clevel: 5
    shuffle: shuffle
  write_empty_chunks: false
hydra:
  job:
    chdir: false
