# General-purpose priors, 2026-11-22: Bob Verity's priors (thread of 15 Nov 2026), as in
# malaria_beta_nh1000_q50.yaml, except p_init. That is a uniform/log-uniform mixture covering series that
# start near zero (e.g. Uganda k13) and series caught at a decent frequency. st stays Beta(1,3), within [0, 1]:
# where OJ (st > 1) and Bob disagree, Bob's prior is used.
seed: 2026112221
num_generations: 120
num_simulations_per_batch: 128
num_batches: 7813
priors:
  num_hosts:
    dist: fixed
    kwargs:
      value: 1000
  num_transmitted_alleles:
    dist: rounded_loguniform
    kwargs:
      minval: 1
      maxval: 50
  chi:
    dist: beta
    kwargs:
      a: 1.0
      b: 2.0
  sw:
    dist: negative_beta
    kwargs:
      a: 1.0
      b: 4.0
  st:
    dist: beta
    kwargs:
      a: 1.0
      b: 3.0
  p_init:                         # general tool: series may start near zero or at a decent frequency
    dist: uniform_loguniform_mixture
    kwargs:                       # half LogUniform(0.001, 0.05), half Uniform(0.001, 0.7)
      minval: 0.001
      maxval: 0.7                 # upper bound on the starting frequency; P(p_init > 0.5) = 0.14, as Beta(1,3) gives 0.125
      low_minval: 0.001
      low_maxval: 0.05
      low_weight: 0.5
output:
  store: outputs/transmission_120gen_1m_general_pmix_v1/train.zarr
  overwrite: false
  num_batches_per_write: 8
  chunks:
    num_simulations: ${num_simulations_per_batch}
    num_generations: ${num_generations}
    num_states: 16
  compression:
    enabled: true
    codec: blosc
    cname: zstd
    clevel: 5
    shuffle: shuffle
  write_empty_chunks: false
hydra:
  job:
    chdir: false
